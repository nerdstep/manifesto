<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Manifesto</title>
    <link rel="stylesheet" href="views://mainview/app.css" />
    <style>
      #crash {
        display: none;
        margin: 18px;
        padding: 12px 14px;
        border: 1px solid #ff6b6b;
        border-radius: 8px;
        color: #ff6b6b;
        font:
          12px/1.5 ui-monospace,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="crash"></div>

    <!-- Register failure and drop guards before loading the application bundle. -->
    <script>
      ;(function () {
        var crash = document.getElementById('crash')
        function show(text) {
          crash.style.display = 'block'
          crash.textContent += text + '\n'
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'Script error') + '  @ ' + (e.filename || '?') + ':' + (e.lineno || 0))
        })
        window.addEventListener('unhandledrejection', function (e) {
          show('Unhandled rejection: ' + String(e.reason))
        })
        ;['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (type) {
          document.addEventListener(
            type,
            function (e) {
              e.preventDefault()
            },
            true,
          )
          window.addEventListener(
            type,
            function (e) {
              e.preventDefault()
            },
            true,
          )
        })
      })()
    </script>

    <div id="root"></div>

    <script src="views://mainview/index.js"></script>
  </body>
</html>
