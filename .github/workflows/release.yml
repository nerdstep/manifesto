name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Deliberately not gated on CI. This job only opens or updates the release
  # pull request; nothing ships until that PR is merged. Gating it meant a red
  # main skipped the job on the release PR's merge commit, and every workflow
  # change pushed afterwards moved that commit further behind main — which
  # GITHUB_TOKEN may not tag, because tagging a commit whose workflow files
  # differ from the default branch needs the Workflows permission that
  # GITHUB_TOKEN cannot hold.
  release_please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Immutable releases are enabled on this repository, so a published
      # release carries a signed attestation.
      attestations: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build_release:
    name: Build ${{ matrix.name }}
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: manifesto-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.release_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check project
        run: bun run check

      - name: Build stable distribution
        run: bun run dist

      - name: Check Windows package
        if: runner.os == 'Windows'
        run: bun run check:package

      - name: Collect release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish release
    needs:
      - release_please
      - build_release
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Publishing the draft is when the release attestation is signed.
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: manifesto-*
          path: release-assets
          merge-multiple: true

      - name: Upload assets and publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks out the repository, so gh has no git remote to
          # infer the target from and fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
