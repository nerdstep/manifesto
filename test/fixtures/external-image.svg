<!-- The <image> covers the whole canvas but can never resolve, so it paints nothing.
     getBBox() still reports 0 0 60x60; the alpha scan must report the mark's real
     extents instead. resvg never fetches it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <image href="https://example.invalid/must-never-be-fetched.png" x="0" y="0" width="60" height="60"/>
  <path d="M10 10 H30 V20 H20 V30 H40 V40 H10 Z" fill="#2E5BFF"/>
</svg>
